{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Claim Item</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Proof of Ownership</label>
            <textarea class="form-control" name="verification_details" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Claim</button>
    </form>
</div>
{% endblock %}

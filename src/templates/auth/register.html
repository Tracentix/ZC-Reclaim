{% extends 'base.html' %}
{% block title %}Register - ZC Reclaim{% endblock %}
{% block content %}
    <div class="form-container">
        <h2>Create Account</h2>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
        <form method="POST" action="{{ url_for('auth.register') }}">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username">
            <label>Email</label>
            <input type="email" name="email" required placeholder="university@zewailcity.edu.eg">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Create a strong password">
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p class="text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.</p>
    </div>
{% endblock %}
